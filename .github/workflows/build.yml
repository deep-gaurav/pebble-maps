name: Build & Pre-release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        env:
          PROTOMAPS_API_KEY: ${{ secrets.PROTOMAPS_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pebblemaps-apk
          path: android/build/outputs/apk/release/*.apk

  build-pbw:
    name: Build Pebble PBW
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl1.2debian libfdt1 libsdl2-2.0-0 libpixman-1-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pebble-tool
        run: uv tool install pebble-tool --python 3.13

      - name: Install Pebble SDK
        run: pebble sdk install latest

      - name: Build PBW
        working-directory: pebble-watchapp
        run: pebble build

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: pebblemaps-pbw
          path: pebble-watchapp/build/*.pbw

  prerelease:
    name: Update Pre-release
    needs: [build-apk, build-pbw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: pebblemaps-apk
          path: dist/

      - name: Download PBW
        uses: actions/download-artifact@v4
        with:
          name: pebblemaps-pbw
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Delete existing pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pre-release --yes || true
          git tag -d pre-release || true
          git push origin :refs/tags/pre-release || true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create pre-release dist/* \
            --title "Latest Build (${SHORT_SHA})" \
            --notes "Automated build from ${SHORT_SHA}." \
            --prerelease